services:
  - type: web
    name: healio-web-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: healio-db
          property: connectionString
      - key: PORT
        value: 5000
